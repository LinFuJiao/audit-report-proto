    if (!deadline) { toast('请选择最晚处理日期'); return; }
    const now = nowStr();
    lead.analysts = ana;
    lead.deadline = deadline;
    lead.status = '预分析';
    lead.assignedAt = now;
    if (isReanalysis) {
      lead.analysisDoneAt = '';
      lead.decisionAt = '';
    }
    lead.logs.push(logAt(now, CURRENT_USER, isReanalysis ? '重新分配预分析人员' : '分配预分析人员', `预分析人员：${ana.join('、')}；最晚处理：${deadline}`));
    closeModal();
    renderAll();
    selectLead(lead.id);
    toast(isReanalysis ? '已重新分配预分析人员，线索进入预分析' : '分配成功');
  });
}

/* ================= 预分析 ================= */
function openAnalysisTab(lead) {
  if (!lead || !canAnalyse(lead)) { toast('当前用户不是该线索的预分析人员'); return; }
  if (PAGE !== 'list') switchView('list', true);
  if (leadEdit.active) finishLeadEdit();
  state.selectedId = lead.id;
  state.detailTab = 'analysis';
  ensureAnalysisDraft(lead);
  analysisView = { leadId: lead.id, isNew: true, selV: null };
  renderList();
  renderDetail();
  const card = $('#detailCard');
  if (card) setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 40);
}

function saveAnalysisDraft(lead) {
  if (!lead || !canAnalyse(lead)) { toast('当前用户不是该线索的预分析人员'); return; }
  const d = ensureAnalysisDraft(lead);
  const conclusionEl = $('#anConclusion');
  if (conclusionEl) d.conclusion = conclusionEl.value;
  const checkedNeed = $('input[name="anNeedFiling"]:checked');
  if (checkedNeed) d.needFiling = checkedNeed.value;
  lead.analysisDraft = {
    conclusion: d.conclusion,
    needFiling: d.needFiling,
    files: d.files.map(f => Object.assign({}, f)),
    savedAt: nowStr()
  };
  persist();
  toast('预分析已保存');
}

function submitAnalysisFromPane(lead) {
  if (!lead || !canAnalyse(lead)) { toast('当前用户不是该线索的预分析人员'); return; }
  const d = ensureAnalysisDraft(lead);
  const conclusion = String(d.conclusion || '').trim();
  const need = d.needFiling;
  if (!conclusion) { toast('请填写分析结论'); const el = $('#anConclusion'); if (el) el.focus(); return; }
  if (!need) { toast('请选择是否需要立项调查'); return; }
  const analysts = (lead.analysts || []).length ? lead.analysts.slice() : [CURRENT_USER];
  submitAnalysis(lead, conclusion, need, analysts, d.files);
}

function submitAnalysis(lead, conclusion, needFiling, analysts, files) {
  const now = nowStr();
  const multi = analysts.length > 1;
  lead.analysts = analysts.slice();
  const record = {
    v: lead.analyses.length + 1, conclusion, needFiling, submittedAt: now, approvedAt: '',
    submitter: CURRENT_USER, analysts: analysts.slice(), files: (files || []).map(f => Object.assign({}, f))
  };
  lead.analyses.push(record);
  analysisDraft = null;
  lead.analysisDraft = null;
  analysisView = { leadId: lead.id, isNew: false, selV: record.v };
  lead.analysisDoneAt = now;
  lead.decisionAt = '';
  lead.logs.push(logAt(now, CURRENT_USER, '提交预分析结论', `预分析人员：${analysts.join('、')}；是否需要立项：${needFiling}`));

  if (needFiling === '是') {
    lead.status = '立项审批中';
    lead.logs.push(logAt(now, '系统', '提交立项审批', '预分析结论：需立项'));
    closeModal();
    renderAll();
    selectLead(lead.id);
    state.detailTab = 'analysis';
    renderDetail();
    toast('预分析已提交，进入立项审批');
    setTimeout(() => {
      if (lead.status !== '立项审批中') return;
      const approvedAt = nowStr();
      record.approvedAt = approvedAt;
      const type = lead.type === '投诉线索' ? '转办投诉' : '专项调查';
      const dynamic = type === '转办投诉' && lead.origin !== 'OA';
      const pid = Math.max(0, ...projects.map(p => p.id)) + 1;
      const code = nextProjectCode();
      const shortName = lead.title.replace(/^关于/, '').replace(/的投诉$/, '').replace(/线索$/, '');
      const project = {
        id: pid, code, name: shortName + '专项调查', leadId: lead.id, type,
        status: '草稿', owner: lead.preAssignees[0] || CURRENT_USER, createdAt: approvedAt,
        startedAt: '', closedAt: '', pushType: '', dynamic,
        logs: [logAt(approvedAt, '系统', '生成草稿项目', `来源线索：${lead.code}`)]
      };
      projects.unshift(project);
      lead.projectId = pid;
      lead.status = '已立项';
      lead.decisionAt = approvedAt;
      lead.logs.push(logAt(approvedAt, '系统', '立项审批通过', `自动生成草稿项目 ${code}`));
      renderAll();
      selectLead(lead.id);
      state.detailTab = 'analysis';
      renderDetail();
      toast('立项审批通过，已生成草稿项目');
    }, 1200);
  } else {
    record.approvedAt = now;
    lead.status = '不立项';
    lead.decisionAt = now;
    if (lead.origin === 'OA' && lead.type === '投诉线索') {
      lead.logs.push(logAt(now, '系统', '预分析审批通过', '结论：不立项；已推送OA归档'));
    } else {
      lead.logs.push(logAt(now, '系统', '预分析审批通过', '结论：不立项，线索保留在线索池'));
    }
    let msg = '预分析已提交，审批通过，结论：不立项';
    if (multi) msg += '，其他预分析人员待办已同步消除';
    closeModal();
    renderAll();
    selectLead(lead.id);
    state.detailTab = 'analysis';
    renderDetail();
    toast(msg);
  }
}

/* ================= 项目启动 / 关闭 ================= */
function startProject(p) {
  if (!p) return;
  if (p.status !== '草稿') { toast('当前项目无需启动'); return; }
  const now = nowStr();
  p.status = '正在执行';
  p.startedAt = now;
  p.logs.push(logAt(now, CURRENT_USER, '启动项目', '项目状态：正在执行'));
  state.selectedProjectId = p.id;
  renderProjects();
  toast('项目已启动');
}

function openProjectCloseModal(p) {
  if (!p) return;
  if (p.status !== '正在执行') { toast('当前项目无需关闭'); return; }
  const needPush = p.type === '转办投诉' && !p.dynamic;
  openModal(`
    ${modalHead('项目关闭')}
    <div class="mb">
      <div class="projbox">
        <div class="pb-h"><b>${esc(p.name)}</b>${statusTag(p.status)}${p.dynamic ? '<span class="tag orange">动态立项</span>' : ''}</div>
        <div class="ll-meta">${esc(p.code)} · ${esc(p.type)} · 项目负责人：${esc(p.owner)}</div>
      </div>
      ${needPush ? `
      <div class="formgrid">
        <div class="frow span3"><label class="req">推送类型</label><div class="fctl">
          <div class="radio-row">
            <label><input type="radio" name="pushType" value="正常投诉调查流程结束" checked>正常投诉调查流程结束</label>
            <label><input type="radio" name="pushType" value="转线索（未能证实）">转线索（未能证实）</label>
          </div>
        </div></div>
      </div>` : ''}
    </div>
    <div class="mf"><button class="btn" type="button" data-close>取消</button><button class="btn navy" type="button" id="closeSave">确认关闭</button></div>
  `, needPush ? 'wide' : '');

  $('#closeSave').addEventListener('click', () => {

    const pushType = needPush ? (($('input[name="pushType"]:checked') || {}).value || '正常投诉调查流程结束') : '';
    p.status = '已关闭';

    p.pushType = pushType;
    p.logs.push(logAt(now, CURRENT_USER, '关闭项目', needPush ? `推送类型：${pushType}` : '项目关闭'));

    closeModal();
    renderProjects();
    toast('项目已关闭');
  });
}

/* ================= 操作分发 ================= */
function openDeleteLeadModal(lead) {
  if (!lead || !canEditInfo(lead)) { toast('仅草稿状态的线索可删除'); return; }
  openModal(`
    ${modalHead('删除线索')}
    <div class="mb">
      <div style="padding:16px 4px;line-height:1.9">
        确定删除线索「<b>${esc(lead.title)}</b>」吗？删除后不可恢复。
      </div>
    </div>
    <div class="mf"><button class="btn" type="button" data-close>取消</button><button class="btn navy" type="button" id="confirmLeadDelete">删除</button></div>
  `);
  $('#confirmLeadDelete').addEventListener('click', () => {
    const idx = leads.findIndex(item => item.id === lead.id);
    if (idx < 0) { closeModal(); return; }
    leads.splice(idx, 1);
    state.selectedId = null;
    closeModal();
    renderAll();
    const first = filteredLeads()[0];
    if (first) selectLead(first.id);
    else renderDetail();
    toast('线索已删除');
  });
}

function handleOp(op, id, el) {
  const l = leads.find(x => x.id === id);
  if (op === 'preview') { previewFile(el.dataset.name || ''); return; }
  if (op === 'download') { downloadFile(el.dataset.name || ''); return; }
  if (op === 'view') { selectLead(id); return; }
  if (op === 'delete') { openDeleteLeadModal(l); return; }
  if (op === 'assign') { openAssignModal(l); return; }
  if (op === 'reanalyse') { openAssignModal(l, 'reanalyse'); return; }
  if (op === 'change') { if (l) startPeopleChange(l); return; }
  if (op === 'analyse') { openAnalysisTab(l); return; }
  if (op === 'saveAnalysis') { saveAnalysisDraft(l); return; }
  if (op === 'submitAnalysis') { submitAnalysisFromPane(l); return; }
  if (op === 'saveLead') { saveLeadForm(leadEdit.isNew ? null : l, leadEdit.isNew); return; }
  if (op === 'edit') { startLeadEdit(l); return; }
  if (op === 'project') { if (l && l.projectId) gotoProject(l.projectId); return; }
  if (op === 'viewlead') {
    if (leads.some(x => x.id === id)) { selectLead(id, true); return; }
    const p = projects.find(x => x.id === id);
    if (p && p.leadId) selectLead(p.leadId, true);
    return;
  }
  if (op === 'viewproj') {
    state.selectedProjectId = id;
    renderProjects();
    const card = $('#projectDetail');
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }
  if (op === 'startproj') { startProject(projects.find(x => x.id === id)); return; }
  if (op === 'closeproj') { openProjectCloseModal(projects.find(x => x.id === id)); return; }
}

function handlePop(pop) {
  const pid = Number(pop.dataset.pid);
  const p = projects.find(x => x.id === pid);
  if (!p) return;
  if (pop.dataset.pop === 'start') startProject(p);
  if (pop.dataset.pop === 'close') openProjectCloseModal(p);
  if (pop.dataset.pop === 'lead' && p.leadId) selectLead(p.leadId, true);
}

    return;

    state.casePage = Math.max(1, Math.min(pages, Number(e.target.value) || 1));

    e.preventDefault();

    renderBoard();
    return;
  }
  if (e.target.matches('.people-auto-input')) {
    if (e.key === 'Escape') { closePeopleAuto(); return; }

    state.page = Math.max(1, Math.min(pages, Number(e.target.value) || 1));
    renderList();
    renderDetail();
  }

    if ($('#pkMask').classList.contains('on')) { closePersonPicker(); return; }
    closeModal();
    $('#todoPanel').classList.remove('on');
  }
});

  if (e.target.matches('.people-auto-input')) showPeopleAuto(e.target);
});

document.addEventListener('focusout', (e) => {
  if (!e.target.matches('.people-auto-input')) return;
  const input = e.target;
  setTimeout(() => {
    if (document.activeElement && document.activeElement.closest && document.activeElement.closest('#peopleAutoMenu')) return;
    normalizePeopleInput(input);
    closePeopleAuto();
  }, 140);
});

document.addEventListener('scroll', () => {
  if (peopleAutoInput && peopleAutoMenuEl && peopleAutoMenuEl.classList.contains('on')) positionPeopleAuto();
}, true);

window.addEventListener('hashchange', () => {
  const view = location.hash.replace('#', '');
  if (['list', 'case'].includes(view) && view !== PAGE) switchView(view);
});

/* ================= 初始化 ================= */
const query = new URLSearchParams(location.search);
const hashView = location.hash.replace('#', '');
if (['list', 'case'].includes(hashView)) PAGE = hashView;
const leadId = Number(query.get('lead'));
if (leadId && leads.some(l => l.id === leadId)) {
  state.selectedId = leadId;
  const idx = filteredLeads().findIndex(l => l.id === leadId);
  if (idx >= 0) state.page = Math.floor(idx / state.pageSize) + 1;
}
if (PAGE === 'project') {
  const projectId = Number(query.get('project'));
  if (projectId && projects.some(p => p.id === projectId)) state.selectedProjectId = projectId;
}
switchView(PAGE, true);

</script>
</body>
</html>
