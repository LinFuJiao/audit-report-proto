<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>监察管理 · 监察线索池</title>
<style>
:root{
  --navy:#11538e;--navy-d:#0d4374;--blue:#3f75a5;--steel:#87a9c6;--bd:#e4e7ed;
  --line:#ebeef5;--head:#f5f7fa;--text:#303133;--sub:#909399;--page:#eceef1;
  --menu2:#174266;--menuhl:#5a8ab4;--topon:#e6f2f9;--green:#67c23a;--orange:#e6a23c;--red:#f56c6c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  color:var(--text);background:#fff;font-size:13px;line-height:1.5}
#shell{display:flex;height:100vh;background:#eceef1}
#stage{flex:1 1 auto;min-width:0;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--page)}
.topbar{flex:0 0 56px;height:56px;background:var(--navy);display:flex;align-items:center;color:#fff}
.topbar .brand{flex:0 0 208px;width:208px;height:100%;display:flex;align-items:center;gap:9px;padding-left:16px;border-right:1px solid rgba(0,0,0,.16)}
.topbar .brand .nm{font-size:15px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.topbar .hamb{width:42px;height:100%;border:none;background:none;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.topbar .hamb:hover{background:rgba(255,255,255,.12)}
.topmenu{display:flex;align-items:stretch;height:56px;overflow:hidden}
.topmenu a{display:inline-flex;align-items:center;padding:0 17px;font-size:14.5px;color:#fff;cursor:pointer;white-space:nowrap;text-decoration:none}
.topmenu a:hover{background:rgba(255,255,255,.12)}
.topmenu a.on{background:var(--topon);color:var(--navy);font-weight:700}
.topbar .spacer{flex:1 1 auto}
.topbar .tuser{display:flex;align-items:center;gap:10px;padding:0 14px;font-size:13.5px;white-space:nowrap}
.topbar .tbadge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 4px;border-radius:3px;background:var(--topon);color:var(--navy);font-size:11px;font-weight:700}
.topbar .ava{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:radial-gradient(circle at 36% 30%,#fff,#c9d4e2)}
.appbody{flex:1 1 auto;min-height:0;display:flex}
.asidemenu{flex:0 0 208px;width:208px;background:var(--navy);overflow-y:auto;padding-bottom:24px}
.asidemenu .mi{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;color:#fff;font-size:14px;cursor:pointer;user-select:none}
.asidemenu .mi:hover,.asidemenu .sub .si:hover{background:rgba(255,255,255,.09)}
.asidemenu .mi.on{background:rgba(255,255,255,.1)}
.asidemenu .mi .ic{flex:0 0 16px;width:16px;height:16px;opacity:.95}
.asidemenu .mi .cv{margin-left:auto;font-size:9px;opacity:.75}
.asidemenu .sub{background:var(--menu2);padding:4px 0 8px}
.asidemenu .subttl{height:34px;display:flex;align-items:center;padding:0 14px 0 34px;font-size:12px;color:rgba(255,255,255,.58);letter-spacing:.5px}
.asidemenu .sub .si{display:flex;align-items:center;height:44px;padding:0 14px 0 44px;font-size:13.5px;color:rgba(255,255,255,.92);cursor:pointer;user-select:none}
.asidemenu .sub .si.on{background:var(--menuhl);color:#fff;font-weight:600}
.content{flex:1 1 auto;min-width:0;overflow-y:auto;background:var(--page);display:flex;flex-direction:column}
.apptabs{display:flex;align-items:flex-end;gap:6px;padding:8px 10px 0;background:#fff;border-bottom:1px solid var(--line);min-height:46px}
.apptabs .home{font-size:12.5px;color:#606266;line-height:32px;padding:0 10px}
.apptabs .tab{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #a9c7ea;border-bottom:none;border-radius:4px 4px 0 0;padding:7px 14px;font-size:12.5px;color:var(--text)}
.apptabs .tab .dot{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.apptabs .tab .x{color:#909399;cursor:pointer}
.screen{display:none;padding:12px 14px 26px}
.screen.on{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:14px;min-width:0}
.listbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #e4e7ed;border-radius:6px 6px 0 0;padding:10px 12px}
.logo{width:34px;height:34px;border-radius:4px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.ptitle{font-size:15px;font-weight:600;color:var(--text);margin-right:6px;white-space:nowrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{height:32px;padding:0 15px;border-radius:4px;border:1px solid #e4e7ed;background:#fff;font-size:12.5px;color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap}
.pills button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pills button:hover{border-color:var(--navy);color:var(--navy)}
.pills button.on:hover{color:#fff}
.texttabs{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-left:8px}
.texttabs button{border:0;background:none;padding:0;font-size:12.5px;color:#606266;cursor:pointer;font-family:inherit;line-height:32px;white-space:nowrap}
.texttabs button:hover{color:var(--navy)}
.texttabs button.on{color:var(--navy);font-weight:600}
.spacer{flex:1 1 auto}
.ctl{height:34px;border:1px solid #e4e7ed;border-radius:4px;padding:0 10px;font-size:12.5px;font-family:inherit;outline:none;background:#fff;color:var(--text);min-width:0}
.ctl:focus{border-color:#a9c7ea;box-shadow:0 0 0 2px rgba(47,127,208,.07)}
select.ctl{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2386909c'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:26px}
.btn{height:34px;padding:0 14px;border-radius:3px;border:1px solid #e4e7ed;background:#fff;font-size:12.5px;color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}.btn.navy:hover{background:var(--navy-d);color:#fff}
.btn.lite{background:#f7fafd;border-color:#c8d8ec;color:var(--navy)}
.btn.blue{background:#3f75a5;border-color:#3f75a5;color:#fff}.btn.blue:hover{background:#35658f;color:#fff}
.btn.sm{height:30px;padding:0 11px;font-size:12px}
.lnk{border:none;background:none;color:#3f75a5;font-size:12.5px;cursor:pointer;padding:0 6px;font-family:inherit;white-space:nowrap}
.lnk:hover{text-decoration:underline}.lnk.mute{color:#9aa0a8}.lnk.dark{color:var(--navy)}
.tablewrap{overflow:auto}
table.lt{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1460px}
table.lt th{background:var(--head);color:#606266;font-weight:500;text-align:left;padding:10px 11px;border:1px solid var(--line);white-space:nowrap}
table.lt td{padding:0 11px;height:40px;border:1px solid var(--line);background:#fff;white-space:nowrap;vertical-align:middle}
table.lt tbody tr[data-rowid]{cursor:pointer}
table.lt tbody tr:hover td{background:#f5f7fa}
table.lt tbody tr.sel td{background:#c2d6e9}
table.lt tbody tr.sel:hover td{background:#c2d6e9}
.pager{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 12px;font-size:12.5px;color:#606266;flex-wrap:wrap}
.pgbtn{min-width:30px;height:30px;border:1px solid #ebeef5;background:#fff;border-radius:3px;font-size:12.5px;color:#606266;cursor:pointer;padding:0 8px}
.pgbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}.pgbtn:hover{border-color:var(--navy);color:var(--navy)}.pgbtn.on:hover{color:#fff}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:2px;font-size:11.5px;line-height:1;white-space:nowrap}
.tag.blue{background:#eaf2fb;color:#2f6da8}.tag.green{background:#edf8e8;color:#4d9b31}
.tag.orange{background:#fdf3e7;color:#b77a22}.tag.red{background:#fdecec;color:#c84646}
.tag.gray{background:#f2f3f5;color:#7d8590}.tag.navy{background:#e7eef7;color:var(--navy)}
.tag.lock{background:#f4f4f5;color:#8b9098;border:1px solid #e7e8ea}
.status-text{font-size:12.5px;color:#303133;line-height:20px;white-space:nowrap}
.dot-red,.dot-orange{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot-red{background:var(--red)}.dot-orange{background:var(--orange)}
.people{display:flex;gap:4px;flex-wrap:wrap;max-width:170px}
.person{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:2px;background:#f2f6fb;color:#41647f;font-size:11.5px}
.muted{color:#a0a5ad}
.detailhead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.detailhead .dt{font-size:15px;font-weight:600;color:var(--navy)}
.detailhead .code{font-size:12.5px;color:#7d8590}
.detailhead .acts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.lead-detailhead{min-height:56px;padding:0;gap:8px;background:#f5f7fa;flex-wrap:nowrap}
.lead-detailhead #detTabs{flex:1 1 auto;gap:6px;padding:10px 12px;margin:0;border-bottom:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.lead-detailhead #detTabs::-webkit-scrollbar{display:none}
.lead-detailhead #detTabs .t2{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 16px;border-radius:0;font-size:13.5px;color:#606266;white-space:nowrap;flex:0 0 auto;outline:0}
.lead-detailhead #detTabs .t2.on{background:var(--navy);color:#fff}
.lead-detailhead #detTabs .t2:hover{background:#eaf0f5;color:var(--navy)}
.lead-detailhead #detTabs .t2.on:hover{background:var(--navy);color:#fff}
.lead-detailhead #detTabs .t2 svg{flex:0 0 auto;opacity:.9}
.lead-detailhead .acts{align-self:center;padding-right:12px}
.tabs2{display:flex;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.t2{height:36px;padding:0 16px;border:none;border-radius:2px 2px 0 0;background:none;font-size:13px;color:#606266;cursor:pointer;font-family:inherit}
.t2:hover{background:#f5f7fa;color:var(--navy)}
.t2.on{background:var(--navy);color:#fff}
.pane{display:none;padding:4px 16px 22px}.pane.on{display:block}
.sect{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--navy);padding:14px 0 7px;margin-bottom:10px}
.sectbar{width:3px;height:16px;background:var(--navy);display:inline-block}
.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px 28px}
.info-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed #eef0f3;min-width:0}
.info-row>label{flex:0 0 104px;text-align:right;color:#7d8590;font-size:12.5px;line-height:20px;white-space:nowrap}
.info-row>div{flex:1 1 auto;min-width:0;color:#303133;font-size:12.5px;line-height:20px;word-break:break-all;white-space:pre-wrap}
.info-row.full{grid-column:1/-1}.info-row.full>label{flex-basis:104px}
.mini-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:2px}
.mini-table th{background:var(--head);color:#606266;font-weight:500;text-align:left;padding:9px 11px;border:1px solid var(--line);white-space:nowrap}
.mini-table td{padding:0 11px;height:40px;border:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.mini-table td.wrap{white-space:normal;line-height:1.65;padding-top:8px;padding-bottom:8px}
.emptyrow td{text-align:center;color:#909399;height:52px}
.upload-line{display:flex;align-items:center;gap:8px;margin:8px 0 10px}
.file-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #dce5f0;background:#f8fbff;border-radius:3px;padding:4px 8px;font-size:11.5px;color:#41647f}
.timeline{display:flex;align-items:flex-start;padding:18px 4px 4px;overflow-x:auto}
.tl-node{position:relative;flex:1 0 150px;text-align:center;min-width:130px}
.tl-node:before{content:"";position:absolute;top:10px;left:0;right:0;height:1px;background:#dfe4ea;z-index:0}
.tl-node:first-child:before{left:50%}.tl-node:last-child:before{right:50%}
.tl-dot{position:relative;z-index:1;width:18px;height:18px;border-radius:50%;border:2px solid #c6cdd6;background:#fff;margin:0 auto 8px}
.tl-node.done .tl-dot{border-color:var(--navy);background:var(--navy)}
.tl-node.cur .tl-dot{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(63,117,165,.12)}
.tl-node > b{display:block;font-size:12px;font-weight:500;color:#606266}
.tl-node > span{display:block;font-size:11.5px;color:#a0a6ae;margin-top:3px}
.tl-node.done > b{color:var(--navy)}.tl-node.done > span{color:#6f7d8a}
.tl-node.alert .tl-dot{border-color:var(--red);background:#fff;box-shadow:0 0 0 4px rgba(245,108,108,.12)}
.tl-node.alert > b{color:#c84646}
.board-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.board-head .bt{font-size:15px;font-weight:600;color:var(--navy)}
.board-summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;padding:14px}
.bsum{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:#fafbfc}
.bsum .bl{font-size:12.5px;color:#7d8590}.bsum .bn{font-size:22px;font-weight:600;color:var(--navy);margin-top:2px}
.bsum.red .bn{color:#c84646}.bsum.orange .bn{color:#b77a22}
.board-insights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 14px 14px}
.board-search{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px 10px;margin:0 14px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:#fafbfc}
.board-search .bs-field{display:flex;align-items:center;gap:6px;min-width:0}
.board-search .bs-field>label{font-size:12px;color:#606266;white-space:nowrap}
.board-search .ctl{height:32px;font-size:12px;background:#fff}
.board-search .bs-actions{display:flex;align-items:center;gap:8px}
.board-search .bs-title{margin-right:auto;font-size:13.5px;font-weight:600;color:var(--navy);white-space:nowrap}
.board-search .bs-export{width:32px;height:32px;padding:0;justify-content:center;color:#606266}
.board-search .bs-export svg{width:14px;height:14px;fill:currentColor}
.insight-card{display:flex;flex-direction:column;min-width:0;min-height:270px;padding:12px;border:1px solid var(--line);border-radius:4px;background:#fff}
.insight-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.insight-title{font-size:13.5px;font-weight:600;color:#303133}
.insight-note{font-size:11.5px;color:#909399;white-space:nowrap}
.status-chart{display:flex;flex:1;align-items:center;justify-content:center;padding:3px 0 0}
.status-column-svg{display:block;width:100%;max-width:720px;height:auto}
.status-column-svg text{font-family:inherit}
.funnel-wrap{display:flex;flex:1;align-items:center;justify-content:center;padding:3px 0 1px}
.funnel-svg{display:block;width:100%;max-width:720px;height:auto}
.funnel-svg text{font-family:inherit;letter-spacing:.1px}
.funnel-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px dashed #e7ebf0;font-size:11.5px;color:#7d8590}
.funnel-foot b{font-size:13px;color:var(--navy)}
.pie-body{display:flex;flex:1;align-items:center;justify-content:center;min-width:0}
.pie-chart{display:block;width:100%;max-width:720px;height:auto;margin:0 auto}
.pie-chart path{stroke:#fff;stroke-width:1.5;transition:opacity .15s}
.pie-chart path:hover{opacity:.82}
.pie-legend-meta b{font-size:11px;font-weight:600;color:#303133}
.rank-chart{display:flex;flex:1;align-items:center;justify-content:center;min-width:0}
.rank-svg{display:block;width:100%;max-width:720px;height:auto}
.rank-svg text{font-family:inherit}
.board-list{padding:0 14px 16px}
.bcard{border:1px solid var(--line);border-radius:4px;margin-bottom:10px;padding:12px 14px 6px}
.bcard-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.bcard-h .bt{font-size:13px;font-weight:600;color:#303133;max-width:560px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard-h .bc{font-size:11.5px;color:#909399}
.bcard-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.bcard .timeline{padding-top:12px;padding-bottom:0}
.bcard .tl-node{flex-basis:0}
.personselect{display:flex;align-items:center;gap:8px;width:100%}
.personselect-box{flex:1;min-height:36px;border:1px solid #e4e7ed;border-radius:4px;background:#fff;display:flex;align-items:center;gap:6px;padding:3px 8px;flex-wrap:wrap;cursor:pointer}
.personselect-box:hover{border-color:#a9c7ea}
.personselect-box.ro{background:#f5f6f8;cursor:default}
.personselect-box.ro:hover{border-color:#e4e7ed}
.pschips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pschip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:#303133}
.pschip i{width:20px;height:20px;border-radius:3px;background:#e8f0fb;color:var(--navy);font-size:11px;font-style:normal;display:flex;align-items:center;justify-content:center}
.pschip .psrm{border:0;background:none;padding:0 2px;color:#a9b0bb;cursor:pointer;font-size:14px;line-height:1}
.pshint{font-size:12px;color:#b1b6bf}
.psbtn{flex:0 0 36px;width:36px;height:36px;border:1px solid #e4e7ed;border-radius:4px;background:#fff;color:#606266;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.psbtn:hover{border-color:var(--navy);color:var(--navy)}
.people-auto{position:relative;width:100%}
.people-auto .ctl{width:100%}
#peopleAutoMenu{position:fixed;z-index:130;display:none;max-height:250px;overflow:auto;padding:4px;background:#fff;border:1px solid #e4e7ed;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
#peopleAutoMenu.on{display:block}
.people-auto-title{padding:5px 8px 6px;color:#909399;font-size:11px}
.people-auto-option{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;padding:7px 8px;border-radius:3px;text-align:left;font-family:inherit;cursor:pointer}
.people-auto-option:hover,.people-auto-option:focus{background:#f2f7fd;outline:none}
.people-auto-option .nm{font-size:12.5px;color:#303133;white-space:nowrap}
.people-auto-option .dp{margin-left:auto;font-size:11px;color:#909399;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.people-auto-empty{padding:16px 8px;text-align:center;color:#909399;font-size:12px}
.pkmask{position:fixed;inset:0;background:rgba(20,32,48,.3);display:none;align-items:center;justify-content:center;z-index:95}
.pkmask.on{display:flex}
.pkpanel{width:560px;max-width:92vw;max-height:78vh;background:#fff;border-radius:6px;box-shadow:0 16px 44px rgba(0,0,0,.24);display:flex;flex-direction:column;overflow:hidden}
.pkhead{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.pkx{border:0;background:none;color:#909399;font-size:18px;cursor:pointer;line-height:1}
.pksearch{padding:12px 18px 0}
.pksearch .ctl{width:100%}
.pklist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 18px;overflow:auto;min-height:190px;align-content:start}
.pkperson{border:1px solid #e4e7ed;border-radius:3px;background:#fff;padding:8px 24px 8px 10px;text-align:left;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}
.pkperson:hover{border-color:#a9c7ea}
.pkperson.on{border-color:#3f75a5;background:#f2f7ff;box-shadow:0 0 0 1px rgba(63,117,165,.1)}
.pkperson .nm{font-size:12.5px;color:#303133}
.pkperson .dp{font-size:10.5px;color:#909399;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkperson.on .nm{color:var(--navy);font-weight:600}

function caseAuthority(c) {
  if (['判决', '法院审理'].includes(c.stage)) return '人民法院';
  if (c.stage === '检察院起诉') return '人民检察院';
  if (['公安受案', '公安立案'].includes(c.stage)) return '属地公安机关';
  if (CASE_CLOSED_STAGES.includes(c.stage)) return '集团监察部';
  return '集团安全保卫部';
}

function caseBusinessUnit(c) {
  const unit = c.department || '';
  if (unit.includes('供应链')) return '供应链审计单元';
  if (unit.includes('乳品')) return '乳品审计单元';
  if (unit.includes('工程')) return '工程审计单元';
  if (unit.includes('电商')) return '电商审计单元';
  if (unit.includes('物流')) return '物流审计单元';
  if (unit.includes('研发')) return '研发审计单元';
  return '总部审计部监察';
}

const STORE_KEY = 'jb_inspection_proto_v3';
let restoredFromStore = false;

function persist() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ leads, projects }));
  } catch (err) {
    /* 原型演示环境忽略存储异常 */
  }
}

(function restore() {
  try {
    if (new URLSearchParams(location.search).get('reset') === '1') {
      localStorage.removeItem(STORE_KEY);
      return;
    }
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (!Array.isArray(data.leads) || !Array.isArray(data.projects)) return;
    restoredFromStore = true;
    leads.splice(0, leads.length, ...data.leads);
    projects.splice(0, projects.length, ...data.projects);
  } catch (err) {
    /* 数据损坏时回退到演示数据 */
  }
})();

  if (Array.isArray(l.preAssignees) && l.preAssignees.length > 1) l.preAssignees = l.preAssignees.slice(0, 1);

  });
});

/* ================= 数据筛选 ================= */
function scopedLeads() {
  return leads.filter(l => {
    if (state.scope === 'dept') return l.ownerUnit === CURRENT_DEPT;
    if (state.scope === 'mine') return l.creator === CURRENT_USER;
    return true;
  });
}

function filteredLeads() {
  const kw = state.kw.trim().toLowerCase();
  const preciseKw = state.preciseKw.trim().toLowerCase();
  return scopedLeads().filter(l => {
    if (state.status !== 'all' && l.status !== state.status) return false;
    if (preciseKw && state.preciseField) {
      const getter = PRECISE_FIELDS[state.preciseField];
      const values = getter ? getter(l) : null;
      const list = Array.isArray(values) ? values : [values];
      if (!list.some(v => String(v || '').trim().toLowerCase() === preciseKw)) return false;
    }
    if (kw) {
      const hay = [
        l.title, l.summary, l.code, l.status, l.type, l.sourceUnit, l.businessUnit, l.ownerUnit,
        l.creator, l.reporterName, l.partnerName, ...l.involve.map(p => p.name)
      ].join(' ').toLowerCase();
      if (!hay.includes(kw)) return false;
    }
    return true;
  }).sort((a, b) => (parseDT(b.receivedAt) || 0) - (parseDT(a.receivedAt) || 0));
}

const PRECISE_FIELDS = {
  code: l => l.code,
  status: l => l.status,
  title: l => l.title,
  type: l => l.type,
  ownerUnit: l => l.ownerUnit,
  businessUnit: l => l.businessUnit
};

const currentProject = () => projects.find(p => p.id === state.selectedProjectId) || null;

function canEditInfo(l) {

}

function deadlineCell(l) {

}

function timeLimitCell(l) {
  if (!l.deadline || !isActive(l)) return '<span class="muted">—</span>';
  const d = daysFromToday(l.deadline);
  if (d < 0) return `<span class="tag red">超期 ${-d} 天</span>`;
  if (d === 0) return '<span class="tag red">今日到期</span>';
  if (d === 1) return '<span class="tag orange">剩余 1 天</span>';
  return `<span class="tag green">剩余 ${d} 天</span>`;
}

function peoplePills(names, lead, showTodo) {

}

}

function opsFor(l) {
  const acts = canEditInfo(l) ? [['edit', '编辑'], ['delete', '删除']] : [['view', '查看']];

function renderList() {
  const all = filteredLeads();
  const pages = Math.max(1, Math.ceil(all.length / state.pageSize));
  if (state.page > pages) state.page = pages;
  const start = (state.page - 1) * state.pageSize;
  const rows = all.slice(start, start + state.pageSize);
  if (rows.length && !rows.some(l => l.id === state.selectedId)) state.selectedId = rows[0].id;

  const body = $('#listBody');
  body.innerHTML = rows.length ? rows.map((l, i) => `
    <tr data-rowid="${l.id}" class="${l.id === state.selectedId ? 'sel' : ''}">
      <td class="num">${start + i + 1}</td>
      <td>${plainStatus(l.status)}</td>
      <td class="code">${esc(l.code)}</td>
      <td><div class="cell-title" title="${esc(l.title)}">${esc(l.title)}</div></td>
      <td class="type-cell">${esc(l.type)}</td>
      <td class="owner-cell">${esc(l.ownerUnit)}</td>
      <td class="owner-cell">${esc(l.businessUnit)}</td>
      <td class="ops">${opsFor(l)}</td>
    </tr>`).join('') : `<tr class="emptyrow"><td colspan="8">暂无线索</td></tr>`;

  renderPager(all.length);
}

function renderPager(total) {
  const pages = Math.max(1, Math.ceil(total / state.pageSize));
  const nums = [];
  for (let i = 1; i <= pages; i++) nums.push(i);
  $('#pager').innerHTML = `
    <span>共 ${total} 条</span>
    <select class="ctl" id="pageSize" style="height:30px;width:94px">
      <option value="10" ${state.pageSize === 10 ? 'selected' : ''}>10条/页</option>
      <option value="20" ${state.pageSize === 20 ? 'selected' : ''}>20条/页</option>
    </select>
    <button class="pgbtn" data-page="${state.page - 1}" ${state.page === 1 ? 'disabled' : ''}>‹</button>
    ${nums.map(n => `<button class="pgbtn ${n === state.page ? 'on' : ''}" data-page="${n}">${n}</button>`).join('')}
    <button class="pgbtn" data-page="${state.page + 1}" ${state.page === pages ? 'disabled' : ''}>›</button>
    <span>前往</span>
    <input class="ctl" id="pageJump" style="height:30px;width:46px" value="${state.page}">
    <span>页</span>`;
}

function renderDetail() {
  closePeopleAuto();
  if (leadEdit.active && leadEdit.isNew) {
    setAuditTabsVisible(false);
    setInvestigationTabVisible(false);
    clearAuditPanes();
    clearInvestigationPane();
    $('#detActions').innerHTML = leadFormActions(null, true);
    if (!leadEdit.built) {
      $('#pane-info').innerHTML = leadEditFormHtml(null, true);
      bindLeadEditForm(null, true);
      leadEdit.built = true;
    }
    toggleDetailPanes();
    return;
  }

  const l = currentLead();
  if (!l) {
    setAuditTabsVisible(false);
    setInvestigationTabVisible(false);
    clearAuditPanes();
    clearInvestigationPane();
    leadEdit = { active: false, leadId: null, isNew: false, editing: false, built: false };
    leadEditFiles = [];
    $('#detActions').innerHTML = '';
    $('#pane-info').innerHTML = '<div class="emptyState">请选择线索</div>';
    toggleDetailPanes();
    return;
  }

  if (!leadEdit.active || leadEdit.leadId !== l.id || leadEdit.isNew) {
    leadEdit = { active: true, leadId: l.id, isNew: false, editing: false, built: false };
    leadEditFiles = (l.attachments || []).map(f => Object.assign({}, f));
  }

  $('#detActions').innerHTML = leadFormActions(l, false);
  const auditVisible = l.status === '已立项' && !leadEdit.editing;
  setAuditTabsVisible(auditVisible);
  if (auditVisible) {
    $('#pane-report').innerHTML = renderAuditReportsPane(l);
    $('#pane-findings').innerHTML = renderAuditFindingsPane(l);
  } else {
    clearAuditPanes();
  }
  const investigationVisible = !!investigationFor(l) && !leadEdit.editing;
  setInvestigationTabVisible(investigationVisible);
  if (investigationVisible) {
    $('#pane-conclusion').innerHTML = renderInvestigationPane(l);
  } else {
    clearInvestigationPane();
  }
  if (leadEdit.editing) {
    if (!leadEdit.built) {
      $('#pane-info').innerHTML = leadEditFormHtml(l, false);
      bindLeadEditForm(l, false);
      leadEdit.built = true;
    }
  } else {
    $('#pane-info').innerHTML = leadEditFormHtml(l, false);
  }
  toggleDetailPanes();
}

/* ================= 变更人员 ================= */
function samePeople(a, b) {
  return (a || []).length === (b || []).length && (a || []).every(x => (b || []).includes(x));
}

function startPeopleChange(l) {
  if (!canChangePeople(l)) { toast('当前状态不可变更人员'); return; }
  changeState = {
    leadId: l.id, mode: 'new', idx: 0,
    draft: { preAssignees: (l.preAssignees || []).slice(), analysts: (l.analysts || []).slice() },
    before: { preAssignees: (l.preAssignees || []).slice(), analysts: (l.analysts || []).slice() }
  };
  state.detailTab = 'change';
  renderDetail();
  toast('已新建变更单，请输入变更后人员并提交');
}

function submitPeopleChange(l) {
  const d = changeState.draft;
  if (!d) { toast('请先点击“增加变更”新建变更单'); return; }
  const pre = readPeopleText('chgPre', true);
  const ana = readPeopleText('chgAna', false);
  if (pre.bad.length || ana.bad.length) {
    toast(`未找到系统人员：${[...pre.bad, ...ana.bad].join('、')}`);
    return;
  }
  if (pre.tooMany) { toast('预分析分配人员只能填写一人'); return; }
  d.preAssignees = pre.names.slice(0, 1);
  d.analysts = ana.names;
  if (!d.preAssignees.length) { toast('请填写预分析分配人员'); return; }
  const preChanged = !samePeople(changeState.before.preAssignees, d.preAssignees);
  const anaChanged = !samePeople(changeState.before.analysts, d.analysts);
  if (!preChanged && !anaChanged) { toast('变更后人员未发生变化'); return; }

  const items = [];
  items.push({
    k: 'preAssignees', label: '预分析分配人员',
    from: (changeState.before.preAssignees || []).join('、') || '—',
    to: d.preAssignees.join('、') || '—'
  });
  items.push({
    k: 'analysts', label: '预分析人员',
    from: (changeState.before.analysts || []).join('、') || '—',
    to: d.analysts.join('、') || '—'
  });

  const now = nowStr();
  l.preAssignees = d.preAssignees.slice(0, 1);
  l.analysts = d.analysts.slice();
  l.changes.push({ time: now, by: CURRENT_USER, state: '已通过', items });
  l.logs.push(logAt(now, CURRENT_USER, '变更人员', `预分析：${l.preAssignees.join('、') || '—'}；分析：${l.analysts.join('、') || '—'}`));
  changeState = { leadId: l.id, mode: 'view', idx: 0, draft: null, before: null };
  state.detailTab = 'change';
  renderAll();
  renderDetail();
  toast('人员变更已提交，审批通过，人员变更已生效');
}

function renderChangePane(l) {
  if (!Array.isArray(l.changes)) l.changes = [];
  if (changeState.leadId !== l.id) {
    changeState = { leadId: l.id, mode: 'view', idx: 0, draft: null, before: null };
  }
  const list = l.changes.slice().reverse();
  if (changeState.mode === 'view' && changeState.idx >= list.length) changeState.idx = 0;
  const rec = changeState.mode === 'view' ? list[changeState.idx] : null;
  const isNew = changeState.mode === 'new' && !!changeState.draft;
  const canChange = canChangePeople(l);

  const infoRows = list.length ? list.map((c, i) => `
    <tr data-ci="${i}" class="${changeState.mode === 'view' && changeState.idx === i ? 'selrow' : ''}">
      <td style="text-align:center">${i + 1}</td>
      <td><span class="tag green">${esc(c.state || '已通过')}</span></td>
      <td>${esc(c.by)}</td>
      <td>${esc(c.time)}</td>
    </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;padding:22px;color:#909399">暂无变更信息</td></tr>';

  let recordRows = '';
  if (isNew) {
    recordRows = `
      <tr>
        <td style="text-align:center">1</td>
        <td>预分析分配人员</td>
        <td><span class="chg-before">${(changeState.before.preAssignees || []).join('、') || '—'}</span></td>
        <td>${peopleAutoInputHtml('chgPre', changeState.draft.preAssignees, '输入姓名，自动匹配系统人员', true)}</td>
      </tr>
      <tr>
        <td style="text-align:center">2</td>
        <td>预分析人员</td>
        <td><span class="chg-before">${(changeState.before.analysts || []).join('、') || '—'}</span></td>
        <td>${peopleAutoInputHtml('chgAna', changeState.draft.analysts, '输入姓名，多人用、分隔', false)}</td>
      </tr>`;
  } else if (rec) {
    const items = rec.items || [];
    recordRows = items.length ? items.map((x, i) => `
      <tr>
        <td style="text-align:center">${i + 1}</td>
        <td>${esc(x.label)}</td>
        <td><span class="chg-before">${esc(x.from || '—')}</span></td>
        <td>${esc(x.to || '—')}</td>
      </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;padding:22px;color:#909399">该变更申请无变更项</td></tr>';
  } else {
    recordRows = '<tr><td colspan="4" style="text-align:center;padding:22px;color:#909399">暂无变更记录</td></tr>';
  }

  const tag = rec
    ? `查看第 ${changeState.idx + 1} 条变更申请（${esc(rec.state)} · ${esc(rec.time)} · ${esc(rec.by)}），仅供查看`
    : (isNew ? '新建变更单（未提交，可编辑）' : '');

  return `
    <div class="sect"><span class="sectbar"></span>变更信息<span class="spacer"></span>
      ${canChange ? '<button class="btn navy sm" id="chgAdd" type="button">＋ 增加变更</button>' : ''}
    </div>
    <div class="tablewrap"><table class="lt chgtb"><thead><tr>
      <th style="width:50px">序号</th><th style="width:108px">变更状态</th><th>变更发起人</th><th style="width:124px">变更日期</th>
    </tr></thead><tbody id="chgInfoBody">${infoRows}</tbody></table></div>
    <div class="pager"><span>共 ${list.length} 条</span></div>
    <div class="sect"><span class="sectbar"></span>变更记录<span class="chg-tag">${tag}</span><span class="spacer"></span>
      ${isNew ? '<button class="btn lite sm" id="chgSave" type="button">保存</button><button class="btn navy sm" id="chgSubmit" type="button">提交</button>' : ''}
    </div>
    <div class="tablewrap"><table class="lt chgtb"><thead><tr>
      <th style="width:42px">序号</th><th style="width:106px">信息</th>
      <th style="width:88px">变更前</th><th>变更后</th>
    </tr></thead><tbody id="chgRecBody">${recordRows}</tbody></table></div>`;
}

function renderTimelinePane(l) {
  const p = projectForLead(l);
  return `
    ${sectionTitle('进度时间线')}
    ${renderTimeline(l)}
    <div class="info-grid two timeline-meta">
      ${infoRow('线索录入时间', esc(l.createdAt || l.receivedAt))}
      ${infoRow('分配时间', l.assignedAt ? esc(l.assignedAt) : '')}
      ${infoRow('分析完成时间', l.analysisDoneAt ? esc(l.analysisDoneAt) : '')}
      ${infoRow('立项/不立项时间', l.decisionAt ? esc(l.decisionAt) : '')}
      ${infoRow('项目启动时间', p && p.startedAt ? esc(p.startedAt) : '')}
      ${infoRow('当前滞留天数', isActive(l) ? `${stayDays(l)} 天` : '—')}
      ${infoRow('最晚处理日期', l.deadline ? deadlineInfoHtml(l) : '')}
      ${infoRow('当前状态', plainStatus(l.status))}
    </div>`;
}

function renderTimeline(l) {
  const p = projectForLead(l);
  const nodes = [
    { label: '线索录入', time: l.createdAt || l.receivedAt },
    { label: '分配', time: l.assignedAt },
    { label: '分析完成', time: l.analysisDoneAt },
    { label: '立项/不立项', time: l.decisionAt },
    { label: '项目启动', time: p ? p.startedAt : l.projectStartedAt }
  ];
  const firstMissing = nodes.findIndex(n => !n.time);
  let marked = false;
  return `<div class="timeline">${nodes.map((n, i) => {
    let cls = '';
    if (n.time) cls = 'done';
    else if (!marked && isActive(l)) {
      cls = (isOverdue(l) && i === firstMissing) ? 'alert' : 'cur';
      marked = true;
    }
    return `<div class="tl-node ${cls}"><span class="tl-dot"></span><b>${n.label}</b><span>${n.time ? esc(n.time) : '—'}</span></div>`;
  }).join('')}</div>`;
}

function renderLogPane(l) {
  if (!l.logs.length) return '<div class="emptyState">暂无流转记录</div>';
  return `${sectionTitle('流转记录')}
    <table class="mini-table">
      <thead><tr><th style="width:156px">时间</th><th style="width:100px">操作人</th><th style="width:150px">操作</th><th>结果</th></tr></thead>
      <tbody>${l.logs.slice().reverse().map(g => `<tr><td>${esc(g.time)}</td><td>${esc(g.user)}</td><td>${esc(g.action)}</td><td class="wrap">${esc(g.result)}</td></tr>`).join('')}</tbody>
    </table>`;
}

/* ================= 进度看板 ================= */
const BOARD_STATUS_ORDER = ['草稿', '待分配', '预分析', '立项审批中', '已立项', '仅查阅', '不立项'];
const BOARD_STATUS_COLORS = {
  '草稿': '#b9bec6',
  '待分配': '#e6a23c',
  '预分析': '#3f75a5',
  '立项审批中': '#8e78b0',
  '已立项': '#67b346',
  '仅查阅': '#8798a9',
  '不立项': '#c7ccd2'
};
const BOARD_PIE_COLORS = ['#11538e', '#3f75a5', '#6d9dc5', '#87a9c6', '#67b346', '#e6a23c', '#8e78b0', '#b78168', '#8798a9', '#b8c7d5'];

function boardShare(count, total) {
  if (!total) return '0%';
  return `${(count / total * 100).toFixed(1).replace(/\.0$/, '')}%`;
}

function groupCountEntries(list, getter) {
  const map = new Map();
  list.forEach(item => {
    const label = String(getter(item) || '未填写').trim() || '未填写';
    map.set(label, (map.get(label) || 0) + 1);
  });
  return Array.from(map, ([label, count]) => ({ label, count }))
    .sort((a, b) => b.count - a.count || a.label.localeCompare(b.label, 'zh-CN'));
}

function boardPieMarkup(items, total, options = {}) {
  const { unitLabel = '条', ariaLabel = '线索来源业务单元分布饼图', compact = false } = options;
  if (!items.length || !total) return '<div class="emptyState">暂无数据</div>';
  const cx = 260;
  const cy = compact ? 140 : 165;
  const radius = compact ? 86 : 100;
  const minLabelY = compact ? 18 : 26;
  const maxLabelY = compact ? 248 : 304;
  const labelGap = compact ? 29 : 34;
  let start = -Math.PI / 2;
  const slices = items.map((item, index) => {
    const sweep = item.count / total * Math.PI * 2;
    const color = BOARD_PIE_COLORS[index % BOARD_PIE_COLORS.length];
    const title = `${esc(item.label)}：${item.count} ${unitLabel}（${boardShare(item.count, total)}）`;
    const midAngle = start + sweep / 2;
    if (sweep >= Math.PI * 2 - 0.0001) {
      return {
        item, index, color, title, sweep,
        path: `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="${color}"><title>${title}</title></circle>`,
        midAngle, side: 'right', labelY: cy
      };
    }
    const end = start + sweep;
    const x1 = cx + radius * Math.cos(start);
    const y1 = cy + radius * Math.sin(start);
    const x2 = cx + radius * Math.cos(end);
    const y2 = cy + radius * Math.sin(end);
    const largeArc = sweep > Math.PI ? 1 : 0;
    start = end;
    return {
      item, index, color, title, sweep, midAngle,
      side: Math.cos(midAngle) >= 0 ? 'right' : 'left',
      labelY: cy + (radius + 8) * Math.sin(midAngle),
      path: `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${radius} ${radius} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${color}" stroke="#fff" stroke-width="1.5"><title>${title}</title></path>`
    };
  });

  const spreadLabels = rows => {
    if (!rows.length) return;
    rows.sort((a, b) => a.labelY - b.labelY);
    for (let i = 1; i < rows.length; i += 1) {
      rows[i].labelY = Math.max(rows[i].labelY, rows[i - 1].labelY + labelGap);
    }
    const overflow = rows[rows.length - 1].labelY - maxLabelY;
    if (overflow > 0) rows.forEach(row => { row.labelY -= overflow; });
    for (let i = rows.length - 2; i >= 0; i -= 1) {
      rows[i].labelY = Math.min(rows[i].labelY, rows[i + 1].labelY - labelGap);
    }
    const underflow = minLabelY - rows[0].labelY;
    if (underflow > 0) rows.forEach(row => { row.labelY += underflow; });
  };
  spreadLabels(slices.filter(slice => slice.side === 'left'));
  spreadLabels(slices.filter(slice => slice.side === 'right'));

  const paths = slices.map(slice => slice.path).join('');
  const labels = slices.map(slice => {
    const sign = slice.side === 'right' ? 1 : -1;
    const arcX = cx + radius * Math.cos(slice.midAngle);
    const arcY = cy + radius * Math.sin(slice.midAngle);
    const kneeX = cx + sign * (radius + 14);
    const endX = cx + sign * (radius + 32);
    const textX = endX + sign * 6;
    const anchor = slice.side === 'right' ? 'start' : 'end';
    return `<polyline points="${arcX.toFixed(2)},${arcY.toFixed(2)} ${kneeX},${slice.labelY.toFixed(2)} ${endX},${slice.labelY.toFixed(2)}" fill="none" stroke="#cdd7e2" stroke-width="1" stroke-linejoin="round"/>
      <circle cx="${arcX.toFixed(2)}" cy="${arcY.toFixed(2)}" r="2.3" fill="${slice.color}"/>
      <text x="${textX}" y="${slice.labelY - 1}" text-anchor="${anchor}" font-size="11.5" font-weight="500" fill="#525b66">${esc(slice.item.label)}</text>
      <text x="${textX}" y="${slice.labelY + 13}" text-anchor="${anchor}" font-size="10" fill="#909399">${slice.item.count} ${unitLabel} · ${boardShare(slice.item.count, total)}</text>`;
  }).join('');

  return `<svg class="pie-chart" viewBox="0 0 520 ${compact ? 272 : 330}" role="img" aria-label="${esc(ariaLabel)}">${paths}${labels}</svg>`;
}

function renderBoardInsights(list) {
  const total = list.length;

  const statusCounts = new Map(BOARD_STATUS_ORDER.map(status => [status, 0]));
  list.forEach(l => statusCounts.set(l.status, (statusCounts.get(l.status) || 0) + 1));
  const maxStatusCount = Math.max(1, ...statusCounts.values());
  const axisMax = Math.max(4, Math.ceil(maxStatusCount / 4) * 4);
  const plotLeft = 44;
  const plotRight = 504;
  const plotTop = 24;
  const plotBottom = 282;
  const plotWidth = plotRight - plotLeft;
  const plotHeight = plotBottom - plotTop;
  const step = plotWidth / BOARD_STATUS_ORDER.length;
  const barWidth = Math.min(36, step * 0.48);
  const gridLines = Array.from({ length: 5 }, (_, index) => {
    const value = axisMax - axisMax / 4 * index;
    const y = plotTop + plotHeight / 4 * index;
    return `<line x1="${plotLeft}" y1="${y}" x2="${plotRight}" y2="${y}" stroke="#e8edf2" stroke-width="1"/>
      <line x1="${plotLeft - 5}" y1="${y}" x2="${plotLeft}" y2="${y}" stroke="#cfd6df" stroke-width="1"/>
      <text x="${plotLeft - 10}" y="${y + 3.5}" text-anchor="end" font-size="10.5" fill="#8c8c8c">${value}</text>`;
  }).join('');
  const bars = BOARD_STATUS_ORDER.map((status, index) => {
    const count = statusCounts.get(status) || 0;
    const centerX = plotLeft + step * index + step / 2;
    const height = count ? count / axisMax * plotHeight : 0;
    const y = plotBottom - height;
    const valueLabel = count ? `<text x="${centerX}" y="${plotBottom - 8}" text-anchor="middle" font-size="10.5" fill="#fff">${count}</text>` : '';
    return `<g><title>${esc(status)}：${count} 条（${boardShare(count, total)}）</title>
      <rect x="${centerX - barWidth / 2}" y="${y}" width="${barWidth}" height="${height}" fill="#5b8ff9"/>
      ${valueLabel}
      <text x="${centerX}" y="${plotBottom + 19}" text-anchor="middle" font-size="11" fill="#595959">${esc(status)}</text>
    </g>`;
  }).join('');
  const statusChart = `<svg class="status-column-svg" viewBox="0 0 520 320" role="img" aria-label="线索状态分布柱状图">${gridLines}${bars}</svg>`;

  const stageCounts = [
    { label: '线索入库', count: total },
    { label: '已分配', count: list.filter(l => !!l.assignedAt).length },
    { label: '预分析完成', count: list.filter(l => !!l.analysisDoneAt).length },
    { label: '已立项', count: list.filter(l => l.status === '已立项' || !!l.projectId).length }
  ];
  let previousCount = total;
  const funnelData = stageCounts.map(stage => {
    const count = Math.min(stage.count, previousCount);
    previousCount = count;
    return { ...stage, displayCount: count, share: boardShare(count, total) };
  });
  const funnelBoundaries = [1, 0.76, 0.58, 0.42, 0.26];
  const funnelWidth = 340;
  const funnelCenter = 210;
  const funnelTop = 12;
  const funnelHeight = 64;
  const funnelColors = ['#5087ef', '#4bc0a5', '#f4b23e', '#705bdc'];
  const funnelSlices = funnelData.map((stage, index) => {
    const y = funnelTop + index * funnelHeight;
    const topHalf = funnelWidth * funnelBoundaries[index] / 2;
    const bottomHalf = funnelWidth * funnelBoundaries[index + 1] / 2;
    const points = [
      `${funnelCenter - topHalf},${y}`,
      `${funnelCenter + topHalf},${y}`,
      `${funnelCenter + bottomHalf},${y + funnelHeight}`,
      `${funnelCenter - bottomHalf},${y + funnelHeight}`
    ].join(' ');
    const textY = y + funnelHeight / 2 + 1;
    const boundaryY = y + funnelHeight;
    const nextStage = funnelData[index + 1];
    const rightEdge = funnelCenter + bottomHalf;
    const conversion = nextStage ? boardShare(nextStage.displayCount, stage.displayCount) : '';
    const callout = nextStage ? `<circle cx="${rightEdge + 3}" cy="${boundaryY}" r="2.2" fill="#c5d1dc"/>
      <line x1="${rightEdge + 6}" y1="${boundaryY}" x2="391" y2="${boundaryY}" stroke="#dbe4ec" stroke-width="1"/>
      <text x="398" y="${boundaryY + 3.5}" fill="#7b8794" font-size="10.5">转化率: <tspan fill="#4b5563" font-weight="600">${conversion}</tspan></text>` : '';
    return `<polygon points="${points}" fill="${funnelColors[index]}" stroke="#fff" stroke-width="1.5"><title>${esc(stage.label)}：${stage.displayCount} 条（${stage.share}）</title></polygon>
      <text x="${funnelCenter}" y="${textY}" text-anchor="middle" dominant-baseline="middle" fill="#fff">
        <tspan font-size="13" font-weight="600">${esc(stage.label)}</tspan>
        <tspan dx="7" font-size="15" font-weight="700">${stage.displayCount}</tspan>
      </text>
      ${callout}`;
  }).join('');
  const funnelChart = `<svg class="funnel-svg" viewBox="0 0 520 280" role="img" aria-label="线索入库至立项漏斗图">${funnelSlices}</svg>`;

  const sourceItems = groupCountEntries(list, l => l.sourceUnit);
  const businessItems = groupCountEntries(list, l => l.businessUnit);
  const topBusinessItems = businessItems.slice(0, 10);
  const maxBusinessCount = Math.max(1, ...topBusinessItems.map(item => item.count));
  const businessAxisMax = Math.max(4, Math.ceil(maxBusinessCount / 4) * 4);
  const barPlotLeft = 150;
  const barPlotRight = 430;
  const barPlotTop = 18;
  const barRowHeight = 27;
  const barHeight = 18;
  const barPlotBottom = barPlotTop + barRowHeight * Math.max(topBusinessItems.length, 1);
  const barPlotWidth = barPlotRight - barPlotLeft;
  const businessGrid = Array.from({ length: 5 }, (_, index) => {
    const value = businessAxisMax / 4 * index;
    const x = barPlotLeft + barPlotWidth / 4 * index;
    return `<line x1="${x}" y1="${barPlotTop}" x2="${x}" y2="${barPlotBottom}" stroke="#e8edf2" stroke-width="1"/>
      <text x="${x}" y="${barPlotBottom + 18}" text-anchor="middle" font-size="10" fill="#8c8c8c">${value}</text>`;
  }).join('');
  const businessBars = topBusinessItems.map((item, index) => {
    const width = item.count / businessAxisMax * barPlotWidth;
    const y = barPlotTop + index * barRowHeight + (barRowHeight - barHeight) / 2;
    const centerY = y + barHeight / 2;
    const color = '#5b8ff9';
    return `<g><title>${index + 1}. ${esc(item.label)}：${item.count} 条（${boardShare(item.count, total)}）</title>
      <text x="138" y="${centerY + 3.5}" text-anchor="end" font-size="10.5" fill="#595959"><tspan font-weight="600" fill="#7b8794">${index + 1}</tspan><tspan dx="6">${esc(item.label)}</tspan></text>
      <rect x="${barPlotLeft}" y="${y}" width="${width}" height="${barHeight}" fill="${color}"/>
      <text x="${barPlotLeft + width + 8}" y="${centerY + 3.5}" font-size="10.5" fill="#595959"><tspan font-weight="600">${item.count}</tspan><tspan dx="4" fill="#8c8c8c">${boardShare(item.count, total)}</tspan></text>
    </g>`;
  }).join('');
  const businessChart = topBusinessItems.length
    ? `<svg class="rank-svg" viewBox="0 0 520 ${barPlotBottom + 36}" role="img" aria-label="线索所属业务单位 TOP10 条形图">${businessGrid}<line x1="${barPlotLeft}" y1="${barPlotBottom}" x2="${barPlotRight}" y2="${barPlotBottom}" stroke="#d9d9d9" stroke-width="1"/>${businessBars}</svg>`
    : '<div class="emptyState">暂无数据</div>';

  return `
    <div class="insight-card">
      <div class="insight-head"><span class="insight-title">线索状态分布</span><span class="insight-note">共 ${total} 条</span></div>
      <div class="status-chart">${statusChart}</div>
    </div>
    <div class="insight-card">
      <div class="insight-head"><span class="insight-title">线索立项趋势分析</span><span class="insight-note">入库至立项漏斗</span></div>
      <div class="funnel-wrap">${funnelChart}</div>
      <div class="funnel-foot"><span>整体立项转化率</span><b>${boardShare(stageCounts[3].count, total)}</b></div>
    </div>
    <div class="insight-card">
      <div class="insight-head"><span class="insight-title">线索来源业务单元分布</span><span class="insight-note">${sourceItems.length} 个来源</span></div>
      <div class="pie-body">${boardPieMarkup(sourceItems, total)}</div>
    </div>
    <div class="insight-card">
      <div class="insight-head"><span class="insight-title">线索所属业务单位 TOP10</span><span class="insight-note">${businessItems.length} 个单位</span></div>
      <div class="rank-chart">${businessChart}</div>
    </div>`;
}

function filterBoardRows(list) {
  const q = state.boardQuery;
  const title = q.title.trim().toLowerCase();
  const businessUnit = q.businessUnit.trim().toLowerCase();
  const overdueMin = q.overdue === '' ? null : Number(q.overdue);
  const stayMin = q.stay === '' ? null : Number(q.stay);
  return list.filter(l => {
    if (q.status && l.status !== q.status) return false;
    if (title && !String(l.title || '').toLowerCase().includes(title)) return false;
    if (businessUnit && !String(l.businessUnit || '').toLowerCase().includes(businessUnit)) return false;
    if (overdueMin !== null && (!isOverdue(l) || -daysFromToday(l.deadline) < overdueMin)) return false;
    if (stayMin !== null && (!isActive(l) || stayDays(l) < stayMin)) return false;
    return true;
  });
}

function renderBoard() {
  const base = scopedLeads();
  const active = base.filter(isActive);
  const summary = [
    { label: '线索总量', num: base.length, cls: '' },
    { label: '待分配', num: base.filter(l => l.status === '待分配').length, cls: '' },
    { label: '待分析', num: base.filter(l => l.status === '预分析').length, cls: '' },
    { label: '已立项', num: base.filter(l => l.status === '已立项').length, cls: '' },
    { label: '超期未处理', num: active.filter(isOverdue).length, cls: 'red' },
    { label: '长期滞留（≥90天）', num: active.filter(l => stayDays(l) >= 90).length, cls: 'orange' }
  ];
  $('#boardSummary').innerHTML = summary.map(s => `<div class="bsum ${s.cls}"><div class="bl">${s.label}</div><div class="bn">${s.num}</div></div>`).join('');
  $('#boardInsights').innerHTML = renderBoardInsights(base);

  const filtered = filterBoardRows(base).sort((a, b) => {
    if (isOverdue(a) !== isOverdue(b)) return isOverdue(a) ? -1 : 1;
    return stayDays(b) - stayDays(a);
  });
  const boardPages = Math.max(1, Math.ceil(filtered.length / state.boardPageSize));
  state.boardPage = Math.max(1, Math.min(state.boardPage, boardPages));
  const boardStart = (state.boardPage - 1) * state.boardPageSize;
  const list = filtered.slice(boardStart, boardStart + state.boardPageSize);

  const boardTime = (v) => v ? `<div class="board-time">${esc(v)}</div>` : '<div class="board-time none">—</div>';
  const rows = list.map((l, i) => {
    const overdue = isOverdue(l);

    const startAt = (p && p.startedAt) || l.projectStartedAt || '';
    return `<tr data-boardid="${l.id}">
      <td class="num">${boardStart + i + 1}</td>
      <td><div class="cell-title" title="${esc(l.title)}">${esc(l.title)}</div></td>
      <td><div class="cell-title" title="${esc(l.businessUnit)}">${esc(l.businessUnit || '—')}</div></td>

      <td>${overdue ? `<span class="board-time overdue">${-daysFromToday(l.deadline)} 天</span>` : '<span class="board-time none">—</span>'}</td>
      <td>${boardTime(l.createdAt || l.receivedAt)}</td>
      <td>${boardTime(l.assignedAt)}</td>
      <td>${boardTime(l.analysisDoneAt)}</td>
      <td>${boardTime(l.decisionAt)}</td>
      <td>${boardTime(startAt)}</td>
      <td>${isActive(l) ? `<span class="board-time">${stay} 天</span>` : '<span class="board-time none">—</span>'}</td>
    </tr>`;
  }).join('');

  $('#boardList').innerHTML = filtered.length ? `
    <div class="tablewrap boardtablewrap">
      <table class="lt boardtable">
        <thead><tr>
          <th style="width:38px">序号</th>
          <th style="width:216px">线索标题</th>
          <th style="width:148px">线索所属业务单位</th>
          <th style="width:88px">状态</th>
          <th style="width:70px">超期天数</th>
          <th style="width:104px">线索录入时间</th>
          <th style="width:104px">分配时间</th>
          <th style="width:104px">分析完成时间</th>
          <th style="width:104px">立项/不立项时间</th>

          <th style="width:58px">滞留</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${boardPagerHtml(filtered.length)}` : '<div class="emptyState">当前筛选范围内暂无数据</div>';

  if ($('#caseBoard')) renderCaseBoard();
}

function applyCaseSearch() {
  const read = id => String((document.getElementById(id) || {}).value || '').trim();
  state.caseQuery = {
    keyword: read('caseKeyword'),
    type: read('caseType'),
    stage: read('caseStage'),
    problemUnit: read('caseProblemUnit'),
    authority: read('caseAuthority'),
    source: read('caseSource'),
    from: read('caseFrom'),
    to: read('caseTo'),
    sortField: state.caseQuery.sortField || 'transferDate',
    sortDir: state.caseQuery.sortDir || 'desc'
  };
  state.casePage = 1;
}

function filteredTransferCases() {
  const q = state.caseQuery;
  const keyword = q.keyword.toLowerCase();
  return transferCases.filter(c => {
    if (q.stage && c.stage !== q.stage) return false;
    if (q.type && c.type !== q.type) return false;
    if (q.from && c.transferDate < q.from) return false;
    if (q.to && c.transferDate > q.to) return false;
    if (q.problemUnit && caseProblemUnit(c) !== q.problemUnit) return false;
    if (q.authority && caseAuthority(c) !== q.authority) return false;
    if (q.source && c.source !== q.source) return false;
    if (keyword) {
      const hay = [c.title, c.code, c.type, c.source, c.transferPerson, c.handler, caseProblemUnit(c), caseAuthority(c), caseBusinessUnit(c)].join(' ').toLowerCase();
      if (!hay.includes(keyword)) return false;
    }
    return true;
  });
}

function sortTransferCases(list) {
  const rows = list.slice();
  const q = state.caseQuery;
  const field = q.sortField || 'transferDate';
  const direction = q.sortDir === 'asc' ? 1 : -1;
  return rows.sort((a, b) => {
    const av = a[field] || '';
    const bv = b[field] || '';
    if (!av && !bv) return b.transferDate.localeCompare(a.transferDate);
    if (!av) return 1;
    if (!bv) return -1;
    return av.localeCompare(bv) * direction;
  });
}

function caseTimelineRow(c, index) {
  const stageIndex = Math.max(0, CASE_FLOW_STAGES.indexOf(c.stage));
  const currentDateIndex = stageIndex <= 0 ? 0 : (stageIndex <= 2 ? 1 : 2);
  const lineWidth = stageIndex <= 0 ? 0 : (stageIndex <= 2 ? 33.333 : 66.666);
  const dateNode = (label, date, index) => {
    const reached = index <= currentDateIndex || !!date;
    const current = index === currentDateIndex;
    return `<div class="case-date-node ${reached ? 'reached' : ''} ${current ? 'current' : ''}">
      <i></i><span>${label}</span><b>${esc(date || '—')}</b>
    </div>`;
  };
  return `<tr data-caseid="${c.id}">
    <td class="case-seq">${index}</td>
    <td class="case-name-cell">
      <div class="case-row-title" title="${esc(c.title)}">${esc(c.title)}</div>
      <div class="case-row-sub">${esc(c.code)}</div>
    </td>
    <td>${esc(c.type)}</td>
    <td title="${esc(caseAuthority(c))}">${esc(caseAuthority(c))}</td>
    <td title="${esc(caseProblemUnit(c))}">${esc(caseProblemUnit(c))}</td>
    <td title="${esc(caseBusinessUnit(c))}">${esc(caseBusinessUnit(c))}</td>
    <td>${esc(c.source)}</td>
    <td class="case-state-cell"><span class="case-status">${esc(c.stage)}</span></td>
    <td class="case-date-cell">
      <div class="case-date-flow">
        <span class="case-date-line"></span>
        <span class="case-date-progress" style="width:${lineWidth}%"></span>
        ${dateNode('移送日期', c.transferDate, 0)}
        ${dateNode('立案时间', c.filedAt, 1)}
        ${dateNode('判决时间', c.judgedAt, 2)}
      </div>
    </td>
  </tr>`;
}

function caseStatusBarMarkup() {
  const counts = CASE_FLOW_STAGES.map(stage => ({ stage, count: transferCases.filter(c => c.stage === stage).length }));
  const total = transferCases.length;
  const maxCount = Math.max(1, ...counts.map(item => item.count));
  const axisMax = Math.max(4, Math.ceil(maxCount / 4) * 4);
  const plotLeft = 44;
  const plotRight = 500;
  const plotTop = 18;
  const plotBottom = 218;
  const plotWidth = plotRight - plotLeft;
  const plotHeight = plotBottom - plotTop;
  const step = plotWidth / counts.length;
  const barWidth = Math.min(54, step * 0.42);
  const gridLines = Array.from({ length: 5 }, (_, index) => {
    const value = axisMax - axisMax / 4 * index;
    const y = plotTop + plotHeight / 4 * index;
    return `<line x1="${plotLeft}" y1="${y}" x2="${plotRight}" y2="${y}" stroke="#e8edf2" stroke-width="1"/>
      <text x="${plotLeft - 10}" y="${y + 3.5}" text-anchor="end" font-size="10.5" fill="#8c8c8c">${value}</text>`;
  }).join('');
  const bars = counts.map((item, index) => {
    const centerX = plotLeft + step * index + step / 2;
    const height = item.count ? item.count / axisMax * plotHeight : 0;
    const y = plotBottom - height;
    const lines = item.stage === '移送外部安全单元' ? ['移送外部', '安全单元'] : [item.stage];
    const labelMarkup = lines.map((line, lineIndex) => `<text x="${centerX}" y="${plotBottom + 17 + lineIndex * 13}" text-anchor="middle" font-size="10" fill="#595959">${esc(line)}</text>`).join('');
    return `<g><title>${esc(item.stage)}：${item.count} 件（${boardShare(item.count, total)}）</title>
      <rect x="${centerX - barWidth / 2}" y="${y}" width="${barWidth}" height="${height}" rx="2" fill="#5b8ff9"/>
      <text x="${centerX}" y="${Math.max(plotTop + 10, y - 8)}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#303133">${item.count}</text>
      ${labelMarkup}
    </g>`;
  }).join('');
  return `<svg class="status-column-svg" viewBox="0 0 520 260" role="img" aria-label="案件状态分布柱状图">
    ${gridLines}<line x1="${plotLeft}" y1="${plotBottom}" x2="${plotRight}" y2="${plotBottom}" stroke="#d9d9d9" stroke-width="1"/>${bars}
  </svg>`;
}

function renderCaseBoard() {
  const total = transferCases.length;
  const running = transferCases.filter(c => !CASE_CLOSED_STAGES.includes(c.stage));
  const completed = transferCases.filter(c => CASE_CLOSED_STAGES.includes(c.stage));
  const judgmentCount = transferCases.filter(c => c.stage === '判决').length;
  const withdrawalCount = transferCases.filter(c => c.stage === '撤案办结').length;
  const completionRate = total ? Math.round(completed.length / total * 100) : 0;
  const kpis = [
    { cls: '', label: '案件总数', value: total, sub: `覆盖 ${new Set(transferCases.map(c => c.department)).size} 个业务单位` },
    { cls: 'run', label: '在办案件', value: running.length, sub: `占全部案件 ${total ? Math.round(running.length / total * 100) : 0}%` },
    { cls: 'done', label: '办结案件', value: completed.length, sub: `办结率 ${completionRate}%`, extra: `<div class="case-kpi-extra"><span>判决数量 <b>${judgmentCount}</b> 件</span><span>撤案数量 <b>${withdrawalCount}</b> 件</span></div>` }
  ];
  $('#caseKpis').innerHTML = kpis.map(k => `
    <div class="case-kpi ${k.cls}"><div class="k">${k.label}</div><div class="v">${k.value}</div><div class="s">${k.sub}</div>${k.extra || ''}</div>`).join('');
  const typeItems = groupCountEntries(transferCases, c => c.type);
  $('#caseInsights').innerHTML = `
    <div class="insight-card case-insight-card">
      <div class="insight-head"><span class="insight-title">案件状态分布</span><span class="insight-note">共 ${total} 件</span></div>
      <div class="status-chart">${caseStatusBarMarkup()}</div>
    </div>
    <div class="insight-card case-insight-card">
      <div class="insight-head"><span class="insight-title">案件类型分布</span><span class="insight-note">${typeItems.length} 类案件</span></div>
      <div class="pie-body">${boardPieMarkup(typeItems, total, { unitLabel: '件', ariaLabel: '案件类型分布饼图', compact: true })}</div>
    </div>`;

  const list = sortTransferCases(filteredTransferCases());
  const pages = Math.max(1, Math.ceil(list.length / state.casePageSize));
  state.casePage = Math.max(1, Math.min(state.casePage, pages));
  const start = (state.casePage - 1) * state.casePageSize;
  const pageRows = list.slice(start, start + state.casePageSize);
  const bodyRows = pageRows.map((c, i) => caseTimelineRow(c, start + i + 1)).join('');
  const upArrow = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10V2M2.5 5.5 6 2l3.5 3.5"/></svg>';
  const downArrow = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v8M2.5 6.5 6 10l3.5-3.5"/></svg>';
  const sortControls = [
    { key: 'transferDate', label: '移送日期' },
    { key: 'filedAt', label: '立案时间' },
    { key: 'judgedAt', label: '判决时间' }
  ].map(item => {
    const activeField = state.caseQuery.sortField === item.key;
    const asc = activeField && state.caseQuery.sortDir === 'asc';
    const desc = activeField && state.caseQuery.sortDir === 'desc';
    return `<span class="case-list-sort"><span class="case-list-sort-label">${item.label}</span><span class="case-sort-arrows"><button type="button" class="case-sort-arrow ${asc ? 'active' : ''}" data-case-sort-field="${item.key}" data-case-sort-dir="asc" title="${item.label}升序" aria-label="${item.label}升序">${upArrow}</button><button type="button" class="case-sort-arrow ${desc ? 'active' : ''}" data-case-sort-field="${item.key}" data-case-sort-dir="desc" title="${item.label}降序" aria-label="${item.label}降序">${downArrow}</button></span></span>`;
  }).join('');
  const table = list.length ? `<div class="case-listbar">${sortControls}</div>
    <div class="case-tablewrap">
    <table class="case-table">
      <colgroup><col style="width:42px"><col style="width:190px"><col style="width:78px"><col style="width:92px"><col style="width:122px"><col style="width:104px"><col style="width:88px"><col style="width:92px"><col style="width:332px"></colgroup>
      <thead><tr><th>序号</th><th>案件名称</th><th>案件类型</th><th>办案主体</th><th>问题所属单位</th><th>业务单元</th><th>案件来源</th><th>案件状态</th><th>办理时间轴</th></tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
  </div>${casePagerHtml(list.length)}` : '<div class="case-empty">暂无符合条件的案件</div>';
  $('#caseTimeline').innerHTML = table;
}

function openCaseDetail(id) {
  const c = transferCases.find(item => item.id === id);
  if (!c) return;
  const isClosed = CASE_CLOSED_STAGES.includes(c.stage);
  const detailStages = CASE_FLOW_STAGES.filter(stage => !CASE_CLOSED_STAGES.includes(stage));
  if (isClosed) detailStages.push(c.stage);
  const idx = detailStages.indexOf(c.stage);
  const steps = detailStages.map((stage, i) => {
    const done = i < idx || (isClosed && i === idx);
    const active = i === idx && !isClosed;
    return `<div class="case-detail-step ${done ? 'done' : ''} ${active ? 'active' : ''}">
      <i></i><span>${esc(stage)}</span></div>`;
  }).join('');
  const field = (label, value) => `<div class="case-field"><span>${label}</span><b>${value}</b></div>`;
  openModal(`
    ${modalHead('案件移交详情')}
    <div class="mb case-detail-body">
      <div class="case-detail-hero">
        <div class="case-detail-hero-main">
          <div class="case-detail-title">${esc(c.title)}</div>
          <div class="case-detail-sub">${esc(c.code)} · ${esc(c.type)} · ${esc(c.source)}</div>
        </div>
        <span class="tag ${CASE_CLOSED_STAGES.includes(c.stage) ? 'green' : 'blue'}">${esc(c.stage)}</span>
      </div>
      <div class="case-detail-grid">
        ${field('案件编号', esc(c.code))}
        ${field('案件类型', esc(c.type))}
        ${field('案件来源', esc(c.source))}
        ${field('案件状态', esc(c.stage))}
        ${field('涉案金额', esc(c.amount))}
        ${field('问题所属单位', esc(c.department))}
        ${field('办案主体', esc(caseAuthority(c)))}
        ${field('业务单元', esc(caseBusinessUnit(c)))}
        ${field('移送人员', esc(c.transferPerson))}
        ${field('移送日期', esc(c.transferDate))}
        ${field('立案时间', esc(c.filedAt || '—'))}
        ${field('判决时间', esc(c.judgedAt || '—'))}
        ${field('当前经办人', esc(c.handler))}
      </div>
      <div class="case-detail-section">
        <h4>案件内容</h4>
        <p>${esc(c.summary)}</p>
      </div>
      <div class="case-detail-section">
        <h4>办理进度</h4>
        <div class="case-detail-steps" style="--case-detail-cols:${detailStages.length}">${steps}</div>
      </div>
      <div class="case-detail-section case-transfer-info">
        <h4>移交信息</h4>
        <div class="case-detail-grid">
          ${field('移送人员', esc(c.transferPerson))}
          ${field('移送日期', esc(c.transferDate))}
          ${field('立案时间', esc(c.filedAt || '—'))}
          ${field('判决时间', esc(c.judgedAt || '—'))}
          ${field('经办人', esc(c.handler))}
          ${field('案件状态', esc(c.stage))}
        </div>
      </div>
    </div>
    <div class="mf"><button class="btn" type="button" data-close>关闭</button></div>
  `, 'xl');
}

/* ================= 监察项目 ================= */
function renderProjects() {
  const kw = state.projKw.trim().toLowerCase();
  const list = projects.filter(p => {
    if (!kw) return true;
    return [p.name, p.code, p.owner, p.type].join(' ').toLowerCase().includes(kw);
  });
  if (list.length && !list.some(p => p.id === state.selectedProjectId)) state.selectedProjectId = list[0].id;
  $('#projectBody').innerHTML = list.length ? list.map((p, i) => {
    const l = leads.find(x => x.id === p.leadId);
    return `<tr data-projid="${p.id}" class="${p.id === state.selectedProjectId ? 'sel' : ''}">
      <td class="num">${i + 1}</td>
      <td class="code">${esc(p.code)}</td>
      <td><div class="cell-title" title="${esc(p.name)}">${esc(p.name)}</div></td>
      <td>${l ? `<button class="lnk" data-op="viewlead" data-id="${l.id}">${esc(l.code)}</button>` : '<span class="muted">—</span>'}</td>
      <td>${esc(p.type)}</td>
      <td>${statusTag(p.status)}</td>
      <td>${esc(p.owner)}</td>
      <td>${esc(p.createdAt)}</td>
      <td class="ops">${projectOps(p)}</td>
    </tr>`;
  }).join('') : '<tr class="emptyrow"><td colspan="9">暂无项目</td></tr>';
  $('#projectCount').textContent = `共 ${list.length} 个关联项目`;
  renderProjectDetail();
  persist();
}

function projectOps(p) {
  const acts = [['viewproj', '查看']];
  if (p.status === '草稿') acts.push(['startproj', '启动']);
  if (p.status === '正在执行') acts.push(['closeproj', '关闭']);
  if (p.leadId) acts.push(['viewlead', '关联线索']);
  return acts.map(([op, label], i) => `<button class="lnk" data-op="${op}" data-id="${p.id}">${label}</button>${i < acts.length - 1 ? '<span class="sep">|</span>' : ''}`).join('');
}

function renderProjectDetail() {
  const p = currentProject();
  if (!p) {
    $('#projectDetail').innerHTML = '<div class="emptyState">请选择项目</div>';
    return;
  }

function switchView(view, keepScroll) {
  const next = view === 'case' ? 'case' : 'list';
  PAGE = next;
  $$('.screen').forEach(el => el.classList.toggle('on', el.id === 'v-' + next));
  $$('.asidemenu .si[data-view]').forEach(el => el.classList.toggle('on', el.dataset.view === next));
  const title = PAGE_TITLES[next] || PAGE_TITLES.list;
  if ($('#appTabTitle')) $('#appTabTitle').textContent = title;
  document.title = '监察管理 · ' + title;
  const hash = '#' + next;
  if (location.hash !== hash) history.replaceState(null, '', location.pathname + location.search + hash);
  renderAll();
  if (next === 'case') renderCaseBoard();
  if (!keepScroll) $('.content').scrollTop = 0;
}


function selectLead(id, fromBoard) {
  const l = leads.find(x => x.id === id);
  if (!l) return;
  if (PAGE !== 'list') switchView('list', true);
  if (leadEdit.active) finishLeadEdit();
  const prevId = state.selectedId;
  state.selectedId = id;
  state.detailTab = 'info';
  if (prevId !== id) {
    state.reportSelId = null;
    state.findingSelId = null;
    changeState = { leadId: id, mode: 'view', idx: 0, draft: null, before: null };
  }
  const list = filteredLeads();
  const idx = list.findIndex(x => x.id === id);
  if (idx >= 0) state.page = Math.floor(idx / state.pageSize) + 1;
  renderList();
  renderDetail();

/* ================= 人员姓名输入与自动匹配 ================= */
let peopleAutoInput = null;
let peopleAutoMenuEl = null;
let suppressPeopleAutoFocus = false;

function peopleAutoInputHtml(key, selected, placeholder, single) {
  const text = (selected || []).filter(Boolean).join('、');
  return `<div class="people-auto">
    <input class="ctl people-auto-input" data-pakey="${key}" data-single="${single ? '1' : '0'}"
      value="${esc(text)}" placeholder="${esc(placeholder || '输入姓名')}" autocomplete="off" spellcheck="false">
  </div>`;
}

function splitPeopleText(value) {
  return String(value || '').split(/[、,，;；\s]+/).map(v => v.trim()).filter(Boolean);
}

function peopleInputParts(value) {
  const text = String(value || '');
  const delimiters = '、,，;； \t\n';
  let last = -1;
  for (let i = 0; i < text.length; i += 1) {
    if (delimiters.includes(text[i])) last = i;
  }
  return { prefix: text.slice(0, last + 1), token: text.slice(last + 1) };
}

function resolvePeopleToken(token) {
  const text = String(token || '').trim();
  if (!text) return null;
  const exact = PEOPLE.find(p => p.name === text);
  if (exact) return exact.name;
  const matches = PEOPLE.filter(p => p.name.includes(text) || p.dept.includes(text));
  return matches.length === 1 ? matches[0].name : null;
}

function readPeopleText(key, single) {
  const input = personScope().querySelector(`input[data-pakey="${key}"]`);
  const tokens = splitPeopleText(input ? input.value : '');
  const names = [];
  const bad = [];
  tokens.forEach(token => {
    const name = resolvePeopleToken(token);
    if (!name) bad.push(token);
    else if (!names.includes(name)) names.push(name);
  });
  return { names: single ? names.slice(0, 1) : names, bad, tooMany: !!single && tokens.length > 1 };
}

function normalizePeopleInput(input) {
  if (!input) return;
  const tokens = splitPeopleText(input.value);
  if (!tokens.length) { input.value = ''; return; }
  const names = tokens.map(resolvePeopleToken);
  if (names.some(name => !name)) return;
  const unique = [...new Set(names)];
  if (input.dataset.single === '1' && unique.length > 1) return;
  input.value = (input.dataset.single === '1' ? unique.slice(0, 1) : unique).join('、');
}

function getPeopleAutoMenu() {
  if (!peopleAutoMenuEl) {
    peopleAutoMenuEl = document.createElement('div');
    peopleAutoMenuEl.id = 'peopleAutoMenu';
    document.body.appendChild(peopleAutoMenuEl);
  }
  return peopleAutoMenuEl;
}

function positionPeopleAuto() {
  if (!peopleAutoInput || !peopleAutoMenuEl) return;
  const r = peopleAutoInput.getBoundingClientRect();
  const menuHeight = Math.min(250, peopleAutoMenuEl.scrollHeight || 250);
  const below = window.innerHeight - r.bottom;
  const top = below >= menuHeight + 8 || below >= 120 ? r.bottom + 4 : Math.max(8, r.top - menuHeight - 4);
  const width = Math.max(r.width, 240);
  peopleAutoMenuEl.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - width - 8))}px`;
  peopleAutoMenuEl.style.top = `${top}px`;
  peopleAutoMenuEl.style.width = `${Math.min(width, window.innerWidth - 16)}px`;
}

function showPeopleAuto(input) {
  if (suppressPeopleAutoFocus) return;
  if (!input || !input.isConnected) return;
  peopleAutoInput = input;
  const menu = getPeopleAutoMenu();
  const token = peopleInputParts(input.value).token.trim();
  const matches = PEOPLE.filter(p => !token || p.name.includes(token) || p.dept.includes(token));
  const rows = matches.length ? matches.map(p => `
    <button type="button" class="people-auto-option" data-pa-name="${esc(p.name)}">
      <span class="nm">${esc(p.name)}</span><span class="dp">${esc(p.dept)}</span>
    </button>`).join('') : '<div class="people-auto-empty">未找到匹配的系统人员</div>';
  menu.innerHTML = `<div class="people-auto-title">系统人员</div>${rows}`;
  menu.classList.add('on');
  positionPeopleAuto();
}

function closePeopleAuto() {
  if (peopleAutoMenuEl) peopleAutoMenuEl.classList.remove('on');
  peopleAutoInput = null;
}

function choosePeopleAuto(name) {
  const input = peopleAutoInput;
  if (!input) return;
  if (input.dataset.single === '1') {
    input.value = name;
  } else {
    const parts = peopleInputParts(input.value);
    const prior = splitPeopleText(parts.prefix);
    input.value = prior.includes(name) ? parts.prefix : `${parts.prefix}${name}、`;
  }
  closePeopleAuto();
  suppressPeopleAutoFocus = true;
  input.focus();
  setTimeout(() => { suppressPeopleAutoFocus = false; }, 0);
  const end = input.value.length;
  try { input.setSelectionRange(end, end); } catch (_) {}
}

function bindLeadEditForm(lead, isNew) {
  const root = $('#pane-info');
  const summary = root.querySelector('#lfSummary');
  summary.addEventListener('input', () => {
    root.querySelector('#lfSummaryCount').textContent = `${summary.value.length}/2000`;
  });
  const involveBody = root.querySelector('#involveBody');
  const involveCkAll = root.querySelector('#involveCkAll');
  const rowsNow = () => Array.from(involveBody.querySelectorAll('tr'));
  const syncInvolveSeq = () => rowsNow().forEach((tr, i) => {
    const seq = tr.querySelector('.seqcol');
    if (seq) seq.textContent = i + 1;
  });
  const syncInvolveAll = () => {
    const boxes = rowsNow().map(tr => tr.querySelector('[data-ick]')).filter(Boolean);
    const checked = boxes.filter(b => b.checked).length;
    involveCkAll.checked = boxes.length > 0 && checked === boxes.length;
    involveCkAll.indeterminate = checked > 0 && checked < boxes.length;
  };
  const addInvolveRow = (row, after) => {
    const html = involveRowHtml(row || { name: '', personId: '', post: '' });
    if (after) after.insertAdjacentHTML('afterend', html);
    else involveBody.insertAdjacentHTML('beforeend', html);
    syncInvolveSeq();
    syncInvolveAll();
  };
  const readInvolveRow = tr => ({
    name: (tr.querySelector('[data-if="name"]') || {}).value || '',
    personId: (tr.querySelector('[data-if="personId"]') || {}).value || '',
    post: (tr.querySelector('[data-if="post"]') || {}).value || ''
  });
  syncInvolveSeq();
  syncInvolveAll();
  root.querySelector('#involveToolbar').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-irow-act]');
    if (!btn) return;
    const act = btn.dataset.irowAct;
    const rows = rowsNow();
    const selected = rows.filter(tr => (tr.querySelector('[data-ick]') || {}).checked);
    if (act === 'add') { addInvolveRow(); return; }
    if (act === 'copy') {
      const src = selected[0] || rows[rows.length - 1];
      addInvolveRow(src ? readInvolveRow(src) : null);
      return;
    }
    if (act === 'insert') {
      const ref = selected[selected.length - 1] || rows[rows.length - 1];
      addInvolveRow(null, ref || null);
      return;
    }
    if (act === 'delete') {
      const targets = selected.length ? selected : (rows.length ? [rows[rows.length - 1]] : []);
      if (!targets.length) { toast('暂无可删除的明细行'); return; }
      targets.forEach(tr => tr.remove());
      if (!rowsNow().length) addInvolveRow();
      syncInvolveSeq();
      syncInvolveAll();
      return;
    }
    if (act === 'clear') {
      if (!rows.length) addInvolveRow();
      else rows.forEach(tr => tr.querySelectorAll('[data-if]').forEach(input => { input.value = ''; }));
      syncInvolveAll();
      return;
    }
    if (act === 'invert') {
      rows.forEach(tr => {
        const box = tr.querySelector('[data-ick]');
        if (box) box.checked = !box.checked;
      });
      syncInvolveAll();
      return;
    }
    if (act === 'deselect') {
      rows.forEach(tr => {
        const box = tr.querySelector('[data-ick]');
        if (box) box.checked = false;
      });
      syncInvolveAll();
    }
  });
  involveBody.addEventListener('change', (e) => {
    if (e.target.matches('[data-ick]')) syncInvolveAll();
  });
  involveCkAll.addEventListener('change', () => {
    rowsNow().forEach(tr => {
      const box = tr.querySelector('[data-ick]');
      if (box) box.checked = involveCkAll.checked;
    });
    syncInvolveAll();
  });
  root.querySelector('#btnPickFile').addEventListener('click', () => openLeadUploadModal('lead'));
  root.querySelector('#fileList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-rmfile]');
    if (!btn) return;
    leadEditFiles.splice(Number(btn.dataset.rmfile), 1);
    refreshLeadInlineFiles();
  });
}

  const now = nowStr();
  if (isNew) {
    const id = Math.max(0, ...leads.map(l => l.id)) + 1;
    const item = mkLead(Object.assign({}, data, {
      id, code: nextLeadCode(), origin: '手动', oaRole: '', status: '草稿',
      createdAt: now, assignedAt: '',

    leads.unshift(item);
    state.selectedId = id;
    state.page = 1;

    renderAll();
    selectLead(lead.id);
  }
}
